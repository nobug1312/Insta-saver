name: IGSave
options:
  deploymentTarget:
    iOS: "17.0"
schemes:
  IGSave:
    build:
      targets:
        IGSave: all
    test:
      targets:
        - IGSaveTests
        - IGSaveUITests
targets:
  IGSave:
    type: application
    platform: iOS
    sources: [IGSave]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: IGSave
        PRODUCT_BUNDLE_IDENTIFIER: com.local.instasaver
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save downloaded photos and videos to your library.
        TARGETED_DEVICE_FAMILY: "1"
  IGSaveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ThumbnailStoreTests.swift
      - IGSave/ThumbnailStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.igsave.tests
        GENERATE_INFOPLIST_FILE: YES
  IGSaveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: IGSave
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.igsave.uitests
        GENERATE_INFOPLIST_FILE: YES
